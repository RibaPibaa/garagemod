name: Build Garage Auction 0.4.0

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find or extract project
        id: locate
        shell: bash
        run: |
          set -e

          BUILD_FILE=$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            ARCHIVE=""

            for FILE in ./*.zip; do
              [ -f "$FILE" ] || continue

              if unzip -Z1 "$FILE" | grep -Eq '(^|/)build\.gradle(\.kts)?$'; then
                ARCHIVE="$FILE"
                break
              fi
            done

            if [ -z "$ARCHIVE" ]; then
              echo "::error::Gradle project and source ZIP not found!"
              exit 1
            fi

            mkdir -p source
            unzip -oq "$ARCHIVE" -d source

            BUILD_FILE=$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::build.gradle not found after extraction!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build mod
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GarageAuction-0.4.0-Forge-1.20.1
          path: ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
