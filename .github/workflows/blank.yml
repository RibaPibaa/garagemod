name: Build Garage Auction

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -o GarageAuction-source.zip -d project
          find project -name build.gradle

      - name: Build
        run: |
          cd "$(dirname "$(find project -name build.gradle -print -quit)")"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GarageAuction
          path: project/**/build/libs/*.jar
          if-no-files-found: error
