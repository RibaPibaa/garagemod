
name: Build Garage Auction 0.5.0

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source project
        run: |
          mkdir -p extracted
          unzip -o GarageAuction-v0.5.0-source.zip -d extracted

      - name: Compile mod
        run: gradle -p extracted/GarageAuctionPack build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GarageAuction-0.5.0-Forge-1.20.1
          path: extracted/GarageAuctionPack/build/libs/garageauction-0.5.0.jar
          if-no-files-found: error
