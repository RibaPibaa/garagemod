name: Build Garage Auction 0.3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source project
        run: |
          mkdir -p extracted
          unzip -o GarageAuction-v2.2-source.zip -d extracted

      - name: Build mod
        working-directory: extracted/GarageAuctionPack
        run: gradle build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: GarageAuction-0.3.0-Forge-1.20.1
          path: extracted/GarageAuctionPack/build/libs/garageauction-0.3.0.jar
          if-no-files-found: error
