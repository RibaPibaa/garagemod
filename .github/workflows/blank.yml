
name: Build Garage Auction

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source archive
        run: |
          mkdir -p extracted
          unzip -o GarageAuction-v2.2-source-2.zip -d extracted

      - name: Find project
        run: |
          PROJECT_FILE=$(find extracted -type f -name "build.gradle" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: build.gradle not found inside archive!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build mod
        run: gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Prepare JAR
        run: |
          mkdir -p release
          find "$PROJECT_DIR/build/libs" -maxdepth 1 \
            -type f -name "*.jar" ! -name "*-sources.jar" \
            -exec cp {} release/ \;

          if [ -z "$(ls -A release)" ]; then
            echo "ERROR: No compiled JAR found!"
            exit 1
          fi

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: GarageAuction-Forge-1.20.1
          path: release/*.jar
          if-no-files-found: error
