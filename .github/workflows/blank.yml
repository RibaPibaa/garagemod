
name: Build Garage Auction

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source project
        run: |
          mkdir -p project
          unzip -o GarageAuction-source.zip -d project

      - name: Find project
        id: locate
        run: |
          BUILD_FILE=$(find project -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build Forge mod
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: GarageAuction-1.20.1
          path: ${{ steps.locate.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
